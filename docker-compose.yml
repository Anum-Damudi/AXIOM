version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: axiom_postgres
    environment:
      POSTGRES_DB: axiom_db
      POSTGRES_USER: axiom_user
      POSTGRES_PASSWORD: axiom_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom_user -d axiom_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.15-community
    container_name: axiom_neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axiom_backend
    environment:
      DATABASE_URL: postgresql://axiom_user:axiom_password@postgres:5432/axiom_db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      SECRET_KEY: axiom_nexus_crime_hackathon_super_secret_jwt_key_2026
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data:
  neo4j_data:
